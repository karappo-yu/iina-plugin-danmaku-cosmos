<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="index.css" />
  <title>niconicocomments Overlay</title>
</head>
<body>
  <canvas id="niconicomments-canvas"></canvas>
  <!-- ?v= 版本参数: WKWebView 会按 URL 缓存 file:// 脚本子资源,不加参数会导致

  <script src="lib/niconicomments.min.js?v=6"></script>
  <script src="input.js?v=6"></script>
  <script src="main.js?v=6"></script>
</body>
</html>
