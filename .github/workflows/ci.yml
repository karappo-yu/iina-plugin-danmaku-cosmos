name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax Check & Test
        run: |
          node --check main.js
          node --check danmaku-document.js
          node --check ipc-transport.js
          node --check plugin-i18n.js
          node --check episode-matcher.js
          node --check ddp-client.js
          node --check overlay/main.js
          node --check sidebar/index.js
          node --test test/*.test.js
