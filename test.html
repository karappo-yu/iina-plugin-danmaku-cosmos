<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>niconicomments 测试</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #222; color: #fff; font-family: sans-serif; }
#container {
  position: relative;
  width: 854px;
  height: 480px;
  margin: 20px auto;
  background: #000;
}
canvas { width: 100%; height: 100%; object-fit: contain; }
#controls {
  width: 854px;
  margin: 10px auto;
  display: flex;
  gap: 12px;
  align-items: center;
}
input[type="file"] { color: #fff; }
input[type="range"] { flex: 1; }
#time { font-size: 12px; opacity: 0.7; min-width: 80px; }
#fps { font-size: 12px; opacity: 0.5; }
</style>
</head>
<body>

<div id="container">
  <canvas id="canvas" width="1920" height="1080"></canvas>
</div>
<div id="controls">
  <input type="file" id="file" accept=".json">
  <input type="range" id="seek" min="0" max="100" value="0">
  <span id="time">0.0s / 0.0s</span>
  <span id="fps"></span>
</div>

  <script src="overlay/lib/niconicomments.min.js"></script>
<script>
const canvas = document.getElementById('canvas');
const seek = document.getElementById('seek');
const timeEl = document.getElementById('time');
const fpsEl = document.getElementById('fps');
const fileInput = document.getElementById('file');

let niconiComments = null;
let allComments = [];
let maxVpos = 0;
let isPlaying = false;

fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const text = await file.text();

  let data;
  try { data = JSON.parse(text); } catch (err) {
    alert('JSON 解析失败');
    return;
  }

  // 自动检测格式：v1 / legacy / formatted
  let format = 'legacy';
  if (Array.isArray(data) && data.length > 0) {
    if (data[0].comments !== undefined) format = 'v1';
    else if (data[0].chat !== undefined) format = 'legacy';
  }

  if (niconiComments) niconiComments.clear();
  niconiComments = new NiconiComments(canvas, data, {
    format,
    keepCA: true,
  });

  // 计算总时长
  maxVpos = 0;
  const scan = (arr) => {
    if (!Array.isArray(arr)) return;
    for (const item of arr) {
      if (item.vposMs !== undefined && item.vposMs / 10 > maxVpos) maxVpos = item.vposMs / 10;
      if (item.vpos !== undefined && item.vpos > maxVpos) maxVpos = item.vpos;
      if (item.chat?.vpos !== undefined && item.chat.vpos > maxVpos) maxVpos = item.chat.vpos;
      if (item.comments) scan(item.comments);
    }
  };
  scan(data);

  isPlaying = true;
  requestAnimationFrame(render);
});

function render() {
  if (!niconiComments || !isPlaying) return;
  const vpos = Number(seek.value);
  niconiComments.drawCanvas(vpos);
  const sec = (vpos / 100).toFixed(1);
  const total = (maxVpos / 100).toFixed(1);
  timeEl.textContent = `${sec}s / ${total}s`;
  seek.max = maxVpos || 1;
  requestAnimationFrame(render);
}
</script>
</body>
</html>
