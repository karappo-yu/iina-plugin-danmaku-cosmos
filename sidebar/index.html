<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="index.css?v=30" />
  <title>Danmaku Control</title>
</head>

<body>
  <div id="root">

    <!-- Tab bar (IINA style: icon + text, active brightens) -->
    <div class="tabbar">
      <div class="tab active" data-tab="basic" data-clickable>
        <svg viewBox="0 0 64 64">
          <path d="M25 14L18 7M39 14L46 7" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <rect x="8" y="18" width="38" height="30" rx="7" fill="none" stroke="currentColor" stroke-width="3"/>
          <rect x="16" y="26" width="12" height="10" rx="2" fill="currentColor"/>
          <circle cx="19" cy="31" r="1.5" fill="white"/>
          <circle cx="24" cy="31" r="1.5" fill="white"/>
          <path d="M16 49L13 54M38 49L41 54" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <circle cx="47" cy="43" r="9" fill="white" stroke="currentColor" stroke-width="3"/>
          <path d="M47 37V49M41 43H53M43 39L51 47M51 39L43 47" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span data-i18n="tab_basic">基础</span>
      </div>
      <div class="tab" data-tab="advanced" data-clickable>
        <svg viewBox="0 0 64 64">
          <path d="M25 14L18 7M39 14L46 7" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <rect x="8" y="18" width="44" height="30" rx="7" fill="none" stroke="currentColor" stroke-width="3"/>
          <rect x="15" y="26" width="12" height="10" rx="2" fill="currentColor"/>
          <circle cx="18" cy="31" r="1.5" fill="white"/>
          <circle cx="23" cy="31" r="1.5" fill="white"/>
          <path d="M34 27H46" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="40" cy="27" r="3" fill="white" stroke="currentColor" stroke-width="2"/>
          <path d="M34 34H46" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="44" cy="34" r="3" fill="white" stroke="currentColor" stroke-width="2"/>
          <path d="M34 41H46" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="38" cy="41" r="3" fill="white" stroke="currentColor" stroke-width="2"/>
          <path d="M16 49L13 54M44 49L47 54" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <span data-i18n="tab_advanced">高级</span>
      </div>
      <div class="tab" data-tab="filter" data-clickable>
        <svg viewBox="0 0 64 64">
          <path d="M14 16H50L37 36V50L27 46V36Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
          <path d="M27 44L22 48" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <span data-i18n="tab_filter">过滤</span>
      </div>
    </div>

    <!-- ==================== Basic tab ==================== -->
    <div id="tab-basic">

      <!-- Danmaku On + File List -->
      <div class="section">
        <div class="toggle-row">
          <span class="toggle-label" data-i18n="danmaku_visible">弹幕开关</span>
          <label class="switch" data-clickable>
            <input type="checkbox" id="toggle-danmaku" checked />
            <span class="switch-slider"></span>
          </label>
        </div>

      <!-- Style Preset -->
      <div class="section" style="margin-top:12px">
        <div class="control-row">
          <span class="toggle-label" data-i18n="style_preset">样式预设</span>
          <div class="segmented" id="style-preset-segmented" data-clickable style="margin-left:auto;width:190px">
            <button class="seg-item active" data-preset="nico">Nico</button>
            <button class="seg-item" data-preset="balanced" data-i18n="style_balanced">Balanced</button>
            <button class="seg-item" data-preset="bilibili">Bilibili</button>
          </div>
        </div>
      </div>

      <div class="adv-separator"></div>

        <div id="danmaku-file-list-section" class="danmaku-file-list-section">
          <div id="danmaku-file-list-container">
            <!-- Example structure matching video track style (JS will populate) -->
            <!--
            <div class="danmaku-file-item selected">
              <span class="item-radio"></span>
              <div class="danmaku-file-item-info">
                <span class="danmaku-file-item-name">example.xml</span>
                <span class="danmaku-file-item-meta">Ass · 12,340 comments</span>
              </div>
            </div>
            -->
          </div>
          <div class="danmaku-file-list-footer">
            <div class="danmaku-file-list-actions">
              <button id="danmaku-file-add-btn" class="danmaku-file-action-btn" data-i18n="file_add">本地添加</button>
              <button id="dandanplay-match-btn" class="danmaku-file-action-btn" data-i18n="dandanplay_match">网络匹配</button>
              <button id="dandanplay-search-btn" class="danmaku-file-action-btn" data-i18n="dandanplay_search">搜索</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Network Danmaku / Dandanplay -->
      <div class="section" id="dandanplay-section">
        <div id="dandanplay-error" class="dandanplay-error" style="display:none"></div>
        <div id="dandanplay-matches">
          <div id="dandanplay-matches-list" style="display:none"></div>
        </div>
        <div id="dandanplay-search-panel" style="display:none">
          <div class="dandanplay-search-input-row">
            <input type="text" id="dandanplay-search-input" data-clickable data-i18n-placeholder="dandanplay_search_placeholder" placeholder="动画标题..." />
            <button id="dandanplay-search-go-btn" class="danmaku-file-action-btn" data-clickable data-i18n="dandanplay_search_go">搜索</button>
          </div>
          <div id="dandanplay-search-results" style="display:none">
            <div class="toggle-row" id="dandanplay-search-results-toggle" data-clickable style="display:none;margin-top:8px">
              <span class="section-title" id="dandanplay-search-results-header" data-i18n="search_results" style="margin:0">搜索结果</span>
              <span class="toggle-arrow" id="dandanplay-search-results-arrow">▶</span>
            </div>
            <div id="dandanplay-search-results-list"></div>
          </div>
        </div>
      </div>

      <!-- Danmaku Count / Date Range -->
      <div class="section" id="danmaku-filter-section" style="display:none">
        <div class="adv-separator"></div>
        <div class="section-title" data-i18n="danmaku_filter">弹幕数量</div>
        <div class="range-selector" id="danmaku-range-selector">
          <div class="range-track"></div>
          <div class="range-coverage" id="filter-coverage">
            <div class="range-handle range-handle-left" id="filter-handle-left"></div>
            <div class="range-handle range-handle-right" id="filter-handle-right"></div>
            <span id="filter-count" class="range-count">0</span>
          </div>
        </div>
        <div class="range-labels">
          <span id="danmaku-filter-date-new"></span>
          <span id="danmaku-filter-date-old"></span>
        </div>
      </div>

      <!-- Density -->
      <div class="section" id="danmaku-density-section" style="display:none">
        <div class="section-title">
          <span data-i18n="density_filter">密度过滤</span>
          <span id="density-count" style="opacity:0.6;font-weight:normal;margin-left:4px"></span>
        </div>
        <div class="control-row">
          <input type="range" id="density-slider" data-clickable min="100" max="600" step="50" value="600" class="slider" />
          <span id="density-value" class="value-text" data-i18n="off">关闭</span>
        </div>
      </div>

      <!-- Opacity -->
      <div class="section">
        <div class="section-title" data-i18n="opacity">不透明度</div>
        <div class="control-row">
          <input type="range" id="opacity-slider" data-clickable min="0.1" max="1" step="0.05" value="0.8" class="slider" />
          <span id="opacity-value" class="value-text">80%</span>
        </div>
      </div>

      <!-- Font Scale -->
      <div class="section">
        <div class="section-title" data-i18n="font_scale">字体缩放</div>
        <div class="control-row">
          <input type="range" id="fontsize-slider" data-clickable min="25" max="100" step="5" value="100" class="slider" />
          <span id="fontsize-value" class="value-text">100%</span>
        </div>
      </div>

    </div>

    <!-- ==================== Advanced tab ==================== -->
    <div id="tab-advanced" style="display:none">

      <!-- Grouped switches matching image style -->
      <div class="toggle-group" style="margin-top:12px">
        <div class="toggle-row">
          <span class="toggle-label" data-i18n="ddp_auto_network">自动加载网络弹幕</span>
          <label class="switch" data-clickable>
            <input type="checkbox" id="ddp-auto-network" checked />
            <span class="switch-slider"></span>
          </label>
        </div>
        <div class="toggle-row">
          <span class="toggle-label" data-i18n="canvas_renderer">使用 Canvas 渲染</span>
          <label class="switch" data-clickable>
            <input type="checkbox" id="canvas-renderer-toggle" />
            <span class="switch-slider"></span>
          </label>
        </div>
        <div class="toggle-row">
          <span class="toggle-label" data-i18n="danmaku_force_simplified">强制简体中文</span>
          <label class="switch" data-clickable>
            <input type="checkbox" id="danmaku-force-simplified-toggle" />
            <span class="switch-slider"></span>
          </label>
        </div>
      </div>

      <div class="adv-separator"></div>

      <!-- Font Weight -->
      <div class="section-title" data-i18n="danmaku_font_weight" style="margin-top:14px">字重</div>
      <div class="control-row">
        <input type="range" id="danmaku-font-weight-slider" data-clickable min="100" max="900" step="50" value="400" class="slider" />
        <span id="danmaku-font-weight-value" class="value-text">400</span>
      </div>



      <!-- Comment Limit -->
      <div class="section-title" data-i18n="comment_limit" style="margin-top:14px">评论数量限制</div>
      <div class="control-row">
        <input type="range" id="comment-limit-slider" data-clickable min="0" max="200" step="10" value="0" class="slider" />
        <span id="comment-limit-value" class="value-text" data-i18n="off">关闭</span>
      </div>

      <!-- Stroke Opacity -->
      <div class="section-title" data-i18n="stroke_opacity" style="margin-top:14px">描边不透明度</div>
      <div class="control-row">
        <input type="range" id="stroke-opacity-slider" data-clickable min="0" max="100" step="5" value="40" class="slider" />
        <span id="stroke-opacity-value" class="value-text">40%</span>
      </div>

      <!-- Stroke Width -->
      <div class="section-title" data-i18n="stroke_width" style="margin-top:14px">描边宽度</div>
      <div class="control-row">
        <input type="range" id="stroke-width-slider" data-clickable min="1" max="8" step="0.5" value="2.8" class="slider" />
        <span id="stroke-width-value" class="value-text">2.8px</span>
      </div>

      <!-- Scroll Speed -->
      <div class="section-title" data-i18n="scroll_speed" style="margin-top:14px">滚动速度</div>
      <div class="control-row">
        <input type="range" id="speed-slider" data-clickable min="25" max="100" step="5" value="100" class="slider" />
        <span id="speed-value" class="value-text">100%</span>
      </div>

      <div class="adv-separator"></div>

      <!-- Stroke Color -->
      <div class="control-row" style="margin-top:14px">
        <span class="toggle-label" data-i18n="stroke_color">描边颜色</span>
        <input type="color" id="stroke-color" value="#000000" style="margin-left:auto" />
      </div>
      <div class="control-row" style="margin-top:8px">
        <span class="toggle-label" data-i18n="stroke_inversion">反色</span>
        <input type="color" id="stroke-inversion-color" value="#ffffff" style="margin-left:auto" />
      </div>
      <!-- Offset -->
      <div class="control-row" style="margin-top:14px">
        <span class="toggle-label" data-i18n="danmaku_offset">弹幕偏移 (秒)</span>
        <input type="number" id="danmaku-offset-input" value="0" min="-30" max="30" step="0.5"
          style="margin-left:auto;width:72px" />
      </div>

      <!-- Font Family -->
      <div class="control-row" style="margin-top:16px">
        <span class="toggle-label" data-i18n="danmaku_font_family">字体</span>
        <select id="danmaku-font-select" data-clickable style="max-width:190px">
          <option value="">默认</option>
          <optgroup label="Japanese">
            <option value="gothic">Hiragino Gothic</option>
            <option value="mincho">Hiragino Mincho</option>
            <option value="maru">Hiragino Maru Gothic</option>
            <option value="yugothic">Yu Gothic</option>
            <option value="yumincho">Yu Mincho</option>
          </optgroup>
          <optgroup label="Chinese">
            <option value="pingfang">PingFang SC</option>
            <option value="songti">Songti SC</option>
            <option value="kaiti">KaiTi</option>
            <option value="yahei">Microsoft YaHei</option>
            <option value="simsun">SimSun</option>
          </optgroup>
          <optgroup label="Generic">
            <option value="sans">sans-serif</option>
            <option value="serif">serif</option>
            <option value="mono">monospace</option>
          </optgroup>
          <option value="custom">自定义…</option>
        </select>
      </div>
      <div class="control-row" id="danmaku-font-custom-row" style="display:none;margin-top:6px">
        <span class="toggle-label" data-i18n="danmaku_font_custom">自定义字体</span>
        <input type="text" id="danmaku-font-custom" placeholder="'Helvetica Neue', sans-serif"
          style="margin-left:auto;width:150px" />
      </div>


    </div>

    <!-- ==================== Filter tab ==================== -->
    <!-- 弹幕列表在上(固定位置,不被下方屏蔽词面板展开挤动);屏蔽词在列表下方 -->
    <div id="tab-filter" style="display:none">
      <div class="section" style="margin-top:12px">
        <div class="section-title">
          <span data-i18n="filter_title">弹幕列表</span>
          <span id="danmaku-browser-total" class="browser-total"></span>
          <label class="switch" data-clickable style="margin-left:auto;transform:scale(0.8)">
            <input type="checkbox" id="danmaku-browser-vis-toggle" />
            <span class="switch-slider"></span>
          </label>
        </div>
        <div class="danmaku-browser-list-wrap">
          <div id="danmaku-browser-list-all" class="danmaku-browser-list" data-clickable>
            <div class="danmaku-browser-spacer"></div>
            <div class="danmaku-browser-empty" style="display:none">未加载弹幕</div>
          </div>
        </div>
        <div class="danmaku-file-list-footer" style="margin-top:6px;padding-top:4px">
          <span id="danmaku-browser-live" class="danmaku-browser-live"></span>
          <button id="danmaku-browser-follow-btn" class="danmaku-file-action-btn" data-i18n="filter_back_live" style="display:none">回到实时</button>
        </div>
        <div id="danmaku-browser-status" class="danmaku-browser-status">browser v23</div>
      </div>
      <div class="adv-separator"></div>
      <div class="section">
        <div class="toggle-row">
          <span class="toggle-label" data-i18n="blocklist_title">屏蔽词</span>
          <label class="switch" data-clickable>
            <input type="checkbox" id="danmaku-blocklist-toggle" />
            <span class="switch-slider"></span>
          </label>
        </div>
        <div id="danmaku-blocklist-panel" style="display:none">
          <div id="danmaku-blocklist-list" class="danmaku-blocklist-list"></div>
          <div id="danmaku-blocklist-empty" class="danmaku-blocklist-empty" data-i18n="blocklist_empty" style="display:none">暂无屏蔽词</div>
          <div class="danmaku-blocklist-add-row">
            <input type="text" id="danmaku-blocklist-input" class="danmaku-blocklist-input" data-i18n-placeholder="blocklist_placeholder" placeholder="屏蔽词或正则..." style="display:none" />
            <button id="danmaku-blocklist-add-btn" class="danmaku-file-action-btn" data-i18n="blocklist_add">添加</button>
          </div>
        </div>
      </div>
      <div class="adv-separator"></div>
      <div class="section">
        <div class="toggle-row">
          <span class="toggle-label" data-i18n="dedupe_title">弹幕去重</span>
          <label class="switch" data-clickable>
            <input type="checkbox" id="danmaku-dedupe-toggle" />
            <span class="switch-slider"></span>
          </label>
        </div>
        <div class="control-row" id="danmaku-dedupe-row" style="display:none;margin-top:6px">
          <span class="toggle-label" data-i18n="dedupe_window">去重区间</span>
          <div class="segmented" id="danmaku-dedupe-segmented" data-clickable style="margin-left:auto;width:200px">
            <button class="seg-item" data-window="1">1s</button>
            <button class="seg-item active" data-window="2">2s</button>
            <button class="seg-item" data-window="3">3s</button>
            <button class="seg-item" data-window="4">4s</button>
            <button class="seg-item" data-window="5">5s</button>
          </div>
        </div>
      </div>
    </div>

  </div>
  <script src="index.js?v=27"></script>
</body>

</html>
