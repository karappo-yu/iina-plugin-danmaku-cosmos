<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="index.css" />
  <title>Danmaku Control</title>
</head>

<body>
  <div id="root">
    <div class="section">
      <div class="toggle-row">
        <span class="toggle-label" data-i18n="danmaku_visible">Danmaku On</span>
        <label class="switch" data-clickable>
          <input type="checkbox" id="toggle-danmaku" checked />
          <span class="switch-slider"></span>
        </label>
      </div>
      <div id="danmaku-file-list-section" class="danmaku-file-list-section">
        <div id="danmaku-file-list-container"></div>
        <div class="danmaku-file-list-footer">
          <span id="danmaku-file-count" class="danmaku-file-count"></span>
          <div class="danmaku-file-list-actions">
            <button id="danmaku-file-add-btn" class="danmaku-file-action-btn" data-i18n="file_add">Add</button>
          </div>
        </div>
      </div>
    </div>

    <div class="section" id="dandanplay-section">
      <div id="dandanplay-error" class="dandanplay-error" style="display:none"></div>
      <div id="dandanplay-matches">
        <div class="toggle-row" id="dandanplay-matches-toggle" data-clickable style="cursor:pointer">
          <span class="section-title" data-i18n="dandanplay_select_match">Network Danmaku</span>
          <span class="toggle-arrow" id="dandanplay-matches-arrow" style="font-size:10px;opacity:0.5">▶</span>
        </div>
        <div id="dandanplay-matches-list" style="display:none"></div>
      </div>
      <div class="dandanplay-actions">
        <button id="dandanplay-search-btn" class="danmaku-file-action-btn" data-i18n="dandanplay_search">Search</button>
      </div>
      <div id="dandanplay-search-panel" style="display:none">
        <div class="dandanplay-search-input-row">
          <input type="text" id="dandanplay-search-input" data-clickable placeholder="Anime title..." />
          <button id="dandanplay-search-go-btn" class="danmaku-file-action-btn" data-clickable data-i18n="dandanplay_search_go">Go</button>
        </div>
        <div id="dandanplay-search-results" style="display:none">
          <div class="toggle-row" id="dandanplay-search-results-toggle" data-clickable style="cursor:pointer;display:none;margin-top:8px">
            <span class="section-title" id="dandanplay-search-results-header">搜索结果</span>
            <span class="toggle-arrow" id="dandanplay-search-results-arrow" style="font-size:10px;opacity:0.5">▶</span>
          </div>
          <div id="dandanplay-search-results-list"></div>
        </div>
      </div>
    </div>

    <div class="section" id="danmaku-filter-section" style="display:none">
      <h3 class="section-title" data-i18n="danmaku_filter">Danmaku Count</h3>
      <div class="range-selector" id="danmaku-range-selector">
        <div class="range-track"></div>
        <div class="range-coverage" id="filter-coverage">
          <div class="range-handle range-handle-left" id="filter-handle-left"></div>
          <div class="range-handle range-handle-right" id="filter-handle-right"></div>
        </div>
      </div>
      <div class="range-labels">
        <span class="range-label-left">0</span>
        <span class="range-label-right" id="range-total-label">0</span>
      </div>
      <span id="danmaku-filter-value" class="value-text">0-0 / 0</span>
    </div>

    <div class="section">
      <h3 class="section-title" data-i18n="opacity">Opacity</h3>
      <div class="control-row">
        <input type="range" id="opacity-slider" data-clickable min="0.1" max="1" step="0.05" value="0.8" class="slider" />
        <span id="opacity-value" class="value-text">80%</span>
      </div>
    </div>

    <div class="section">
      <h3 class="section-title" data-i18n="font_scale">Font Scale</h3>
      <div class="control-row">
        <input type="range" id="fontsize-slider" data-clickable min="50" max="100" step="5" value="100" class="slider" />
        <span id="fontsize-value" class="value-text">100%</span>
      </div>
    </div>

    <div class="section">
      <div class="toggle-row" id="advanced-toggle" data-clickable style="cursor:pointer">
        <span class="section-title" data-i18n="advanced">Advanced</span>
        <span id="advanced-arrow" style="font-size:10px;opacity:0.5">▶</span>
      </div>
      <div id="advanced-content" style="display:none">
        <div class="toggle-row" style="margin-top:10px">
          <span class="toggle-label">自动加载网络弹幕</span>
          <label class="switch" data-clickable>
            <input type="checkbox" id="ddp-auto-network" checked />
            <span class="switch-slider"></span>
          </label>
        </div>
        <div class="toggle-row" style="margin-top:10px">
          <span class="toggle-label">使用 canvas 渲染</span>
          <label class="switch" data-clickable>
            <input type="checkbox" id="canvas-renderer-toggle" />
            <span class="switch-slider"></span>
          </label>
        </div>
        <h3 class="section-title" data-i18n="comment_limit" style="margin-top:10px">Comment Limit</h3>
        <div class="control-row">
          <input type="range" id="comment-limit-slider" data-clickable min="0" max="200" step="10" value="0" class="slider" />
          <span id="comment-limit-value" class="value-text">Off</span>
        </div>
        <h3 class="section-title" data-i18n="stroke_opacity" style="margin-top:10px">Stroke Opacity</h3>
        <div class="control-row">
          <input type="range" id="stroke-opacity-slider" data-clickable min="0" max="100" step="5" value="40" class="slider" />
          <span id="stroke-opacity-value" class="value-text">40%</span>
        </div>
        <h3 class="section-title" data-i18n="stroke_width" style="margin-top:10px">Stroke Width</h3>
        <div class="control-row">
          <input type="range" id="stroke-width-slider" data-clickable min="1" max="8" step="0.5" value="2.8" class="slider" />
          <span id="stroke-width-value" class="value-text">2.8px</span>
        </div>
        <h3 class="section-title" data-i18n="scroll_speed" style="margin-top:10px">Center Speed</h3>
        <div class="control-row">
          <input type="range" id="speed-slider" data-clickable min="50" max="150" step="5" value="95" class="slider" />
          <span id="speed-value" class="value-text">95%</span>
        </div>
        <div class="control-row" style="margin-top:10px">
          <span class="toggle-label" data-i18n="stroke_color">Stroke Color</span>
          <input type="color" id="stroke-color" value="#000000" style="margin-left:auto;padding:0;border:none;width:30px;height:24px;cursor:pointer;background:none" />
        </div>
        <div class="control-row" style="margin-top:6px">
          <span class="toggle-label" data-i18n="stroke_inversion">Invert Color</span>
          <input type="color" id="stroke-inversion-color" value="#ffffff" style="margin-left:auto;padding:0;border:none;width:30px;height:24px;cursor:pointer;background:none" />
        </div>
      </div>
    </div>
  </div>
  <script src="index.js"></script>
</body>

</html>
