<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="index.css" />
  <title>Danmaku Control</title>
</head>

<body>
  <div id="root">
    <div class="section">
      <div class="toggle-row">
        <span class="toggle-label" data-i18n="danmaku_visible">Danmaku On</span>
        <label class="switch" data-clickable>
          <input type="checkbox" id="toggle-danmaku" checked />
          <span class="switch-slider"></span>
        </label>
      </div>
      <div id="danmaku-file-list-section" class="danmaku-file-list-section">
        <div id="danmaku-file-list-container"></div>
        <div class="danmaku-file-list-footer">
          <span id="danmaku-file-count" class="danmaku-file-count"></span>
          <div class="danmaku-file-list-actions">
            <button id="danmaku-file-add-btn" class="danmaku-file-action-btn" data-i18n="file_add">Add</button>
          </div>
        </div>
      </div>
    </div>

    <div class="section">
      <h3 class="section-title" data-i18n="opacity">Opacity</h3>
      <div class="control-row">
        <input type="range" id="opacity-slider" data-clickable min="0.1" max="1" step="0.05" value="0.8" class="slider" />
        <span id="opacity-value" class="value-text">80%</span>
      </div>
    </div>

    <div class="section">
      <h3 class="section-title" data-i18n="font_scale">Font Scale</h3>
      <div class="control-row">
        <input type="range" id="fontsize-slider" data-clickable min="25" max="150" step="5" value="100" class="slider" />
        <span id="fontsize-value" class="value-text">100%</span>
      </div>
    </div>

    <div class="section">
      <h3 class="section-title" data-i18n="canvas_mode">Mode</h3>
      <div class="control-row">
        <span class="toggle-label" data-i18n="canvas_mode_label">Render Mode</span>
        <select id="canvas-mode-select" data-clickable>
          <option value="default" data-i18n="canvas_mode_default">Auto</option>
          <option value="html5" data-i18n="canvas_mode_html5">HTML5</option>
          <option value="flash" data-i18n="canvas_mode_flash">Flash</option>
        </select>
      </div>
    </div>
  </div>
  <script src="index.js"></script>
</body>

</html>
