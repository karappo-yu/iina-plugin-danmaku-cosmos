<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="index.css" />
  <title>Danmaku Control</title>
</head>

<body>
  <div id="root">
    <div class="section">
      <div class="toggle-row">
        <span class="toggle-label" data-i18n="danmaku_visible">Danmaku On</span>
        <label class="switch" data-clickable>
          <input type="checkbox" id="toggle-danmaku" checked />
          <span class="switch-slider"></span>
        </label>
      </div>
      <div id="danmaku-file-list-section" class="danmaku-file-list-section">
        <div id="danmaku-file-list-container"></div>
        <div class="danmaku-file-list-footer">
          <span id="danmaku-file-count" class="danmaku-file-count"></span>
          <div class="danmaku-file-list-actions">
            <button id="danmaku-file-add-btn" class="danmaku-file-action-btn" data-i18n="file_add">Add</button>
          </div>
        </div>
      </div>
    </div>

    <div class="section">
      <h3 class="section-title" data-i18n="opacity">Opacity</h3>
      <div class="control-row">
        <input type="range" id="opacity-slider" data-clickable min="0.1" max="1" step="0.05" value="0.8" class="slider" />
        <span id="opacity-value" class="value-text">80%</span>
      </div>
    </div>

    <div class="section">
      <h3 class="section-title" data-i18n="font_scale">Font Scale</h3>
      <div class="control-row">
        <input type="range" id="fontsize-slider" data-clickable min="25" max="100" step="5" value="100" class="slider" />
        <span id="fontsize-value" class="value-text">100%</span>
      </div>
    </div>

    <div class="section">
      <div class="toggle-row" id="advanced-toggle" data-clickable style="cursor:pointer">
        <span class="section-title" data-i18n="advanced">Advanced</span>
        <span id="advanced-arrow" style="font-size:10px;opacity:0.5">▶</span>
      </div>
      <div id="advanced-content" style="display:none">
        <div class="control-row" style="margin-top:8px">
          <span class="toggle-label" data-i18n="canvas_mode_label">Render Mode</span>
          <select id="canvas-mode-select" data-clickable style="margin-left:auto">
            <option value="default" data-i18n="canvas_mode_default">Auto</option>
            <option value="html5" data-i18n="canvas_mode_html5">HTML5</option>
            <option value="flash" data-i18n="canvas_mode_flash">Flash</option>
          </select>
        </div>
        <div class="control-row" style="margin-top:8px">
          <span class="toggle-label" data-i18n="stroke_color">Stroke Color</span>
          <input type="color" id="stroke-color" value="#000000" style="margin-left:auto;padding:0;border:none;width:30px;height:24px;cursor:pointer;background:none" />
        </div>
        <div class="control-row" style="margin-top:6px">
          <span class="toggle-label" data-i18n="stroke_inversion">Invert Color</span>
          <input type="color" id="stroke-inversion-color" value="#ffffff" style="margin-left:auto;padding:0;border:none;width:30px;height:24px;cursor:pointer;background:none" />
        </div>
        <div class="control-row" style="margin-top:6px">
          <span class="toggle-label" data-i18n="stroke_opacity">Stroke Opacity</span>
          <input type="range" id="stroke-opacity-slider" data-clickable min="0" max="100" step="5" value="40" class="slider" />
          <span id="stroke-opacity-value" class="value-text">40%</span>
        </div>
        <div class="control-row" style="margin-top:6px">
          <span class="toggle-label" data-i18n="stroke_width">Stroke Width</span>
          <input type="range" id="stroke-width-slider" data-clickable min="1" max="8" step="0.5" value="2.8" class="slider" />
          <span id="stroke-width-value" class="value-text">2.8px</span>
        </div>
        <div class="control-row" style="margin-top:10px">
          <span class="toggle-label" data-i18n="comment_limit">Comment Limit</span>
          <label class="switch" data-clickable style="margin-left:auto;flex-shrink:0">
            <input type="checkbox" id="comment-limit-enable" />
            <span class="switch-slider"></span>
          </label>
        </div>
        <div id="comment-limit-row" style="display:none;margin-top:6px">
          <div class="control-row">
            <input type="range" id="comment-limit-slider" data-clickable min="10" max="200" step="10" value="40" class="slider" />
            <span id="comment-limit-value" class="value-text">40</span>
          </div>
        </div>
        <div class="control-row" style="margin-top:8px">
          <span class="toggle-label" data-i18n="scroll_speed">Scroll Speed</span>
          <input type="range" id="speed-slider" data-clickable min="50" max="150" step="5" value="95" class="slider" />
          <span id="speed-value" class="value-text">95%</span>
        </div>
      </div>
    </div>
  </div>
  <script src="index.js"></script>
</body>

</html>
