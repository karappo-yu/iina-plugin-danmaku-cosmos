<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="index.css?v=66" />
  <title>Danmaku Control</title>
</head>

<body>
  <div id="root">

    <!-- Tab bar (IINA 1.5 segmented pill style) -->
    <div class="tabbar">
      <div class="tab active" data-tab="basic" data-clickable>
        <svg viewBox="0 0 64 64">
          <path d="M25 14L18 7M39 14L46 7" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
          <rect x="8" y="18" width="38" height="30" rx="7" fill="none" stroke="currentColor" stroke-width="3.5"/>
          <rect x="16" y="26" width="12" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2.5"/>
          <circle cx="19.5" cy="31" r="1.5" fill="currentColor"/>
          <circle cx="24.5" cy="31" r="1.5" fill="currentColor"/>
          <path d="M16 49L13 54M38 49L41 54" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
          <circle cx="47" cy="43" r="9" fill="none" stroke="currentColor" stroke-width="3.5"/>
          <path d="M47 37V49M41 43H53M43 39L51 47M51 39L43 47" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <span data-i18n="tab_basic">基础</span>
      </div>
      <div class="tab" data-tab="advanced" data-clickable>
        <svg viewBox="0 0 64 64">
          <path d="M25 14L18 7M39 14L46 7" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
          <rect x="8" y="18" width="44" height="30" rx="7" fill="none" stroke="currentColor" stroke-width="3.5"/>
          <rect x="15" y="26" width="12" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2.5"/>
          <circle cx="18.5" cy="31" r="1.5" fill="currentColor"/>
          <circle cx="23.5" cy="31" r="1.5" fill="currentColor"/>
          <path d="M34 27H46" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="40" cy="27" r="3" fill="currentColor"/>
          <path d="M34 34H46" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="44" cy="34" r="3" fill="currentColor"/>
          <path d="M34 41H46" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="38" cy="41" r="3" fill="currentColor"/>
          <path d="M16 49L13 54M44 49L47 54" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
        </svg>
        <span data-i18n="tab_advanced">高级</span>
      </div>
      <div class="tab" data-tab="filter" data-clickable>
        <svg viewBox="0 0 64 64">
          <path d="M14 16H50L37 36V50L27 46V36Z" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/>
          <path d="M27 44L22 48" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
        </svg>
        <span data-i18n="tab_filter">过滤</span>
      </div>
    </div>

    <!-- ==================== Basic tab ==================== -->
    <div id="tab-basic" class="pane-stack">

      <!-- Track section: header + toggle outside card, TrackSelector directly below (1:1 IINA 1.5 Subtitles pane) -->
      <div id="danmaku-file-list-section" class="danmaku-track-section">
        <div class="track-section-header">
          <div class="track-section-label">
            <svg class="track-section-icon" viewBox="0 0 16 16" aria-hidden="true">
              <rect x="1.5" y="2.5" width="13" height="9.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
              <path d="M4.5 6h5M6.5 8.8h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              <path d="M5 12l-1.5 2.2L7.5 12" fill="currentColor"/>
            </svg>
            <span class="track-section-title" data-i18n="danmaku_visible">弹幕开关</span>
          </div>
          <label class="switch" data-clickable>
            <input type="checkbox" id="toggle-danmaku" checked />
            <span class="switch-slider"></span>
          </label>
        </div>
        <div id="danmaku-file-list-container"></div>
      </div>

      <!-- Card: Local / Network source actions + DDP matches & search (1:1 IINA 1.5 LoadSubtitleView) -->
      <div class="iina-card sources-actions-card">
        <div class="danmaku-file-list-footer">
          <div class="danmaku-file-list-actions">
            <button id="danmaku-file-add-btn" class="danmaku-file-action-btn" data-i18n="file_add">本地添加</button>
            <button id="dandanplay-match-btn" class="danmaku-file-action-btn" data-i18n="dandanplay_match">网络匹配</button>
            <button id="dandanplay-search-btn" class="danmaku-file-action-btn" data-i18n="dandanplay_search">搜索</button>
          </div>
        </div>

        <div id="dandanplay-section">
          <div id="dandanplay-error" class="dandanplay-error" style="display:none"></div>
          <div id="dandanplay-matches">
            <div id="dandanplay-matches-list" style="display:none"></div>
          </div>
          <div id="dandanplay-search-panel" style="display:none">
            <div class="dandanplay-search-input-row">
              <input type="text" id="dandanplay-search-input" data-clickable data-i18n-placeholder="dandanplay_search_placeholder" placeholder="动画标题..." />
              <button id="dandanplay-search-go-btn" class="danmaku-file-action-btn" data-clickable data-i18n="dandanplay_search_go">搜索</button>
            </div>
            <div id="dandanplay-search-results" style="display:none">
              <div class="toggle-row" id="dandanplay-search-results-toggle" data-clickable style="display:none;margin-top:8px">
                <span class="section-title" id="dandanplay-search-results-header" data-i18n="search_results" style="margin:0">搜索结果</span>
                <span class="toggle-arrow" id="dandanplay-search-results-arrow">▶</span>
              </div>
              <div id="dandanplay-search-results-list"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Card: Style Preset -->
      <div class="iina-card">
        <div class="control-row preset-row">
          <span class="toggle-label" data-i18n="style_preset">样式预设</span>
          <div class="segmented preset-segmented" id="style-preset-segmented" data-clickable>
            <button class="seg-item active" data-preset="nico">Nico</button>
            <button class="seg-item" data-preset="balanced" data-i18n="style_balanced">Balanced</button>
            <button class="seg-item" data-preset="bilibili">Bilibili</button>
          </div>
        </div>
      </div>

      <!-- Card: Date Slice -->
      <div class="section iina-card" id="danmaku-filter-section" style="display:none">
        <div class="section-title" data-i18n="danmaku_filter">日期切片</div>
        <div class="range-selector" id="danmaku-range-selector">
          <div class="range-track"></div>
          <div class="range-coverage" id="filter-coverage">
            <div class="range-handle range-handle-left" id="filter-handle-left" data-clickable tabindex="0" role="slider" data-i18n-aria-label="date_filter_start"></div>
            <div class="range-handle range-handle-right" id="filter-handle-right" data-clickable tabindex="0" role="slider" data-i18n-aria-label="date_filter_end"></div>
            <span id="filter-count" class="range-count">0</span>
          </div>
        </div>
        <div class="range-labels">
          <span id="danmaku-filter-date-start"></span>
          <span id="danmaku-filter-date-end"></span>
        </div>
      </div>

      <!-- Card: Quick Sliders (Density + Opacity + Font Scale) -->
      <div class="section iina-card card-stack" id="danmaku-basic-sliders-card">
        <div class="slider-group" id="danmaku-density-section">
          <div class="section-header">
            <span class="section-title" data-i18n="density_filter">弹幕密度</span>
            <span id="density-count" class="section-meta"></span>
          </div>
          <div class="control-row">
            <input type="range" id="density-slider" data-clickable min="50" max="550" step="50" value="550" class="slider" />
            <span id="density-value" class="value-text" data-i18n="unlimited">无限制</span>
          </div>
        </div>

        <div class="slider-group">
          <div class="section-title" data-i18n="opacity">不透明度</div>
          <div class="control-row">
            <input type="range" id="opacity-slider" data-clickable min="0.1" max="1" step="0.05" value="0.8" class="slider" />
            <span id="opacity-value" class="value-text">80%</span>
          </div>
        </div>

        <div class="slider-group">
          <div class="section-title" data-i18n="font_scale">字体缩放</div>
          <div class="control-row">
            <input type="range" id="fontsize-slider" data-clickable min="25" max="100" step="5" value="100" class="slider" />
            <span id="fontsize-value" class="value-text">100%</span>
          </div>
        </div>
      </div>

    </div>

    <!-- ==================== Advanced tab ==================== -->
    <div id="tab-advanced" class="pane-stack" style="display:none">

      <!-- Card: Behavior Toggles -->
      <div class="toggle-group iina-card iina-card-flush">
        <div class="toggle-row">
          <span class="toggle-label" data-i18n="ddp_auto_network">自动加载网络弹幕</span>
          <label class="switch" data-clickable>
            <input type="checkbox" id="ddp-auto-network" checked />
            <span class="switch-slider"></span>
          </label>
        </div>
        <div class="toggle-row">
          <span class="toggle-label" data-i18n="canvas_renderer">使用 Canvas 渲染</span>
          <label class="switch" data-clickable>
            <input type="checkbox" id="canvas-renderer-toggle" />
            <span class="switch-slider"></span>
          </label>
        </div>
        <div class="toggle-row">
          <span class="toggle-label" data-i18n="danmaku_force_simplified">强制简体中文</span>
          <label class="switch" data-clickable>
            <input type="checkbox" id="danmaku-force-simplified-toggle" />
            <span class="switch-slider"></span>
          </label>
        </div>
        <div class="toggle-row" id="danmaku-auto-offset-row" style="display:none">
          <span class="toggle-label" data-i18n="danmaku_auto_offset">自动设置片头偏移</span>
          <label class="switch" data-clickable>
            <input type="checkbox" id="danmaku-auto-offset-toggle" />
            <span class="switch-slider"></span>
          </label>
        </div>
      </div>

      <!-- Card: Typography & Motion -->
      <div class="iina-card card-stack">
        <div class="control-row">
          <span class="toggle-label" data-i18n="danmaku_font_family">字体</span>
          <select id="danmaku-font-select" data-clickable>
            <option value="" data-i18n="font_default">默认</option>
            <optgroup label="Japanese" data-i18n-label="font_japanese">
              <option value="gothic">Hiragino Gothic</option>
              <option value="mincho">Hiragino Mincho</option>
              <option value="maru">Hiragino Maru Gothic</option>
              <option value="yugothic">Yu Gothic</option>
              <option value="yumincho">Yu Mincho</option>
            </optgroup>
            <optgroup label="Chinese" data-i18n-label="font_chinese">
              <option value="pingfang">PingFang SC</option>
              <option value="songti">Songti SC</option>
              <option value="kaiti">KaiTi</option>
              <option value="yahei">Microsoft YaHei</option>
              <option value="simsun">SimSun</option>
            </optgroup>
            <optgroup label="Generic" data-i18n-label="font_generic">
              <option value="sans">sans-serif</option>
              <option value="serif">serif</option>
              <option value="mono">monospace</option>
            </optgroup>
            <option value="custom" data-i18n="font_custom">自定义…</option>
          </select>
        </div>
        <div class="control-row" id="danmaku-font-custom-row" style="display:none">
          <span class="toggle-label" data-i18n="danmaku_font_custom">自定义字体</span>
          <input type="text" id="danmaku-font-custom" placeholder="'Helvetica Neue', sans-serif" class="font-custom-input" />
        </div>

        <div class="slider-group">
          <div class="section-title" data-i18n="danmaku_font_weight">字重</div>
          <div class="control-row">
            <input type="range" id="danmaku-font-weight-slider" data-clickable min="100" max="900" step="50" value="500" class="slider" />
            <span id="danmaku-font-weight-value" class="value-text">500</span>
          </div>
        </div>

        <div class="slider-group">
          <div class="section-title" data-i18n="scroll_speed">滚动速度</div>
          <div class="control-row">
            <input type="range" id="speed-slider" data-clickable min="25" max="100" step="5" value="100" class="slider" />
            <span id="speed-value" class="value-text">100%</span>
          </div>
        </div>

        <div class="slider-group">
          <div class="section-title" data-i18n="comment_limit">同屏上限</div>
          <div class="control-row">
            <input type="range" id="comment-limit-slider" data-clickable min="10" max="210" step="10" value="210" class="slider" />
            <span id="comment-limit-value" class="value-text" data-i18n="unlimited">无限制</span>
          </div>
        </div>
      </div>

      <!-- Card: Outline & Shadow -->
      <div class="iina-card card-stack">
        <div class="slider-group">
          <div class="section-title" data-i18n="stroke_opacity">描边不透明度</div>
          <div class="control-row">
            <input type="range" id="stroke-opacity-slider" data-clickable min="0" max="100" step="5" value="100" class="slider" />
            <span id="stroke-opacity-value" class="value-text">100%</span>
          </div>
        </div>

        <div class="slider-group">
          <div class="section-title" data-i18n="stroke_width">描边宽度</div>
          <div class="control-row">
            <input type="range" id="stroke-width-slider" data-clickable min="0" max="8" step="0.1" value="0" class="slider" />
            <span id="stroke-width-value" class="value-text">0px</span>
          </div>
        </div>

        <div id="css-text-shadow-control" class="slider-group" style="display:none">
          <div class="section-title">
            <label for="css-text-shadow-blur-slider" data-i18n="css_text_shadow_blur">Shadow blur</label>
          </div>
          <div class="control-row">
            <input type="range" id="css-text-shadow-blur-slider" data-clickable min="0" max="10" step="0.5" value="2" class="slider" disabled />
            <span id="css-text-shadow-blur-value" class="value-text">2px</span>
          </div>
        </div>

        <div class="card-divider"></div>

        <div class="control-row">
          <span class="toggle-label" data-i18n="stroke_color">描边颜色</span>
          <input type="color" id="stroke-color" value="#000000" class="color-well" />
        </div>
        <div class="control-row">
          <span class="toggle-label" data-i18n="stroke_inversion">反色</span>
          <input type="color" id="stroke-inversion-color" value="#ffffff" class="color-well" />
        </div>
      </div>

      <!-- Card: Timing Offset -->
      <div class="iina-card card-stack">
        <div class="control-row">
          <span class="toggle-label" data-i18n="danmaku_offset">弹幕偏移 (秒)</span>
          <input type="number" id="danmaku-offset-input" value="0" min="-30" max="30" step="0.5" class="offset-input" />
        </div>
        <div id="duration-mismatch-hint" class="dandanplay-error" style="display:none"></div>
      </div>

    </div>

    <!-- ==================== Filter tab ==================== -->
    <div id="tab-filter" class="pane-stack" style="display:none">

      <!-- Card: Virtualized Danmaku Timeline -->
      <div class="toggle-group iina-card iina-card-flush">
        <div class="toggle-row">
          <div class="toggle-row-left">
            <span class="toggle-label" data-i18n="filter_title">弹幕列表</span>
            <span id="danmaku-browser-total" class="browser-total"></span>
          </div>
          <label class="switch" data-clickable>
            <input type="checkbox" id="danmaku-browser-vis-toggle" />
            <span class="switch-slider"></span>
          </label>
        </div>
        <div class="danmaku-browser-list-wrap">
          <div id="danmaku-browser-list-all" class="danmaku-browser-list" data-clickable>
            <div class="danmaku-browser-spacer"></div>
            <div class="danmaku-browser-empty" data-i18n="filter_empty" style="display:none">未加载弹幕</div>
          </div>
          <button id="danmaku-browser-follow-btn" class="danmaku-browser-follow-float" data-i18n="filter_back_live" style="display:none">回到实时</button>
        </div>
      </div>

      <!-- Card: Blocklist & Position Blocking -->
      <div class="toggle-group iina-card iina-card-flush">
        <div class="toggle-row">
          <span class="toggle-label" data-i18n="blocklist_title">屏蔽词</span>
          <label class="switch" data-clickable>
            <input type="checkbox" id="danmaku-blocklist-toggle" />
            <span class="switch-slider"></span>
          </label>
        </div>
        <div id="danmaku-blocklist-panel" style="display:none">
          <div id="danmaku-blocklist-list" class="danmaku-blocklist-list"></div>
        </div>
        <div class="toggle-row">
          <span class="toggle-label" data-i18n="block_top">屏蔽顶部弹幕</span>
          <label class="switch" data-clickable>
            <input type="checkbox" id="danmaku-block-top-toggle" />
            <span class="switch-slider"></span>
          </label>
        </div>
        <div class="toggle-row">
          <span class="toggle-label" data-i18n="block_bottom">屏蔽底部弹幕</span>
          <label class="switch" data-clickable>
            <input type="checkbox" id="danmaku-block-bottom-toggle" />
            <span class="switch-slider"></span>
          </label>
        </div>
      </div>

      <!-- Card: Deduplicate -->
      <div class="toggle-group iina-card iina-card-flush">
        <div class="toggle-row">
          <span class="toggle-label" data-i18n="dedupe_title">弹幕去重</span>
          <label class="switch" data-clickable>
            <input type="checkbox" id="danmaku-dedupe-toggle" />
            <span class="switch-slider"></span>
          </label>
        </div>
        <div class="control-row dedupe-row" id="danmaku-dedupe-row" style="display:none">
          <span class="toggle-label" data-i18n="dedupe_window">去重区间</span>
          <div class="segmented dedupe-segmented" id="danmaku-dedupe-segmented" data-clickable>
            <button class="seg-item" data-window="1">1s</button>
            <button class="seg-item active" data-window="2">2s</button>
            <button class="seg-item" data-window="3">3s</button>
            <button class="seg-item" data-window="4">4s</button>
            <button class="seg-item" data-window="5">5s</button>
          </div>
        </div>
      </div>

    </div>

  </div>
  <script src="index.js?v=73"></script>
</body>

</html>
